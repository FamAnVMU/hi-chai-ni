name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: HI Chinese ${{ github.ref_name }} – Kiểm Toán Toàn Diện, Dark Mode & Tối Ưu Hóa Hệ Thống
          draft: false
          prerelease: false
          body: |
            ## 🌟 HI Chinese ${{ github.ref_name }} – Bản Phát Hành Kiểm Toán Toàn Diện (Offline-First)

            Bản phát hành **HI Chinese ${{ github.ref_name }}** hoàn tất toàn bộ 4 giai đoạn kiểm toán kỹ thuật, nâng cấp schema SQLite `v21`, đồng bộ sư phạm HSK 1–6, bảo mật AI Tutor & âm thanh thực tế, cùng hệ thống giao diện Dark Mode chuẩn tương phản WCAG.

            ### 🚀 Điểm Nhấn Phiên Bản ${{ github.ref_name }}
            - **Core Data, FTS5 & Bảo Toàn Dữ Liệu (`Wave 1 & 2`):** Nâng cấp SQLite `v21` với chỉ mục tìm kiếm toàn văn FTS5 cho từ điển 119k mục, khử trùng lặp từ vựng/SRS, sửa toàn vẹn gói học liệu HSK 1–6 và tính streak chính xác theo múi giờ người dùng.
            - **Sư Phạm, Lộ Trình & Kiểm Tra Đầu Vào (`Wave 2`):** Chuẩn hóa mô hình Gamified Micro-Learning, bài thi tốt nghiệp từng cấp HSK, cân bằng đáp án đọc hiểu và mở khóa CAT chính xác.
            - **AI Tutor, Bảo Mật & Âm Thanh (`Wave 2`):** Cô lập xác thực BYOK vs Custom Proxy, chống SSRF, stream hội thoại JSON sạch với gợi ý tiếp theo, loại bỏ file MP3 câm và kích hoạt fallback TTS tự nhiên.
            - **Dark Mode, A11y 48dp & Settings (`Wave 3`):** Bảng màu ngữ nghĩa Sáng/Tối phủ trên 25+ màn hình, nối 4 công tắc Cài đặt (`showPinyinByDefault`, `showRubyAnnotation`, `speechRate`, `autoPlayAudio`) và gộp thanh tiêu đề AI Tutor.
            - **Kiểm Thử Toàn Diện (`Phase 4`):** Đạt `0` lỗi `flutter analyze` và `852/852` bài test tự động PASS (gồm `asset_integrity_audit_test.dart` và `end_to_end_audit_regression_test.dart`).

            ### 📦 Danh Sách Tệp APK Cài Đặt (Release APKs)
            - **`hi-chinese-v1.0.17-arm64-v8a.apk`**: Dành cho hầu hết thiết bị Android 64-bit hiện đại (khuyên dùng).
            - **`hi-chinese-v1.0.17-armeabi-v7a.apk`**: Dành cho thiết bị Android 32-bit đời cũ hoặc máy cấu hình phổ thông.
            - **`app-release.apk`**: Bản dựng Release tiêu chuẩn (arm64-v8a).
          files: |
            release-apk/hi-chinese-v1.0.17-arm64-v8a.apk
            release-apk/hi-chinese-v1.0.17-armeabi-v7a.apk
            release-apk/app-release.apk
