name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          name: HI Chinese ${{ github.ref_name }} – Nền Tảng Tự Học HSK Hoàn Chỉnh (HSK 1–6)
          draft: false
          prerelease: false
          body: |
            ## 🌟 HI Chinese ${{ github.ref_name }} – Nền Tảng Tự Học HSK Hoàn Chỉnh (Offline-First)

            Bản phát hành chính thức của **HI Chinese** dành riêng cho hệ điều hành Android, mở rộng toàn diện học liệu HSK 1 đến HSK 6.
            
            ### 🚀 Điểm Nhấn Phiên Bản ${{ github.ref_name }}
            - **Mở Rộng Học Liệu HSK 4–6:** Tích hợp 3 gói Content Pack chuẩn hóa (`hsk4_pack_v1.json`, `hsk5_pack_v1.json`, `hsk6_pack_v1.json`) với đầy đủ 6 chặng sư phạm, 116 bài học mới, điểm ngữ pháp và bài thi tốt nghiệp từng cấp.
            - **Làm Giàu Ngữ Liệu Song Ngữ Trung – Việt (OER):** Làm giàu câu ví dụ chuẩn từ Tatoeba Project (CC BY 2.0 FR) và từ điển Hán-Việt CVDICT (CC BY-SA 4.0), loại bỏ bản dịch máy chưa kiểm chứng.
            - **Bảo Vệ Tiến Độ Người Học Tuyệt Đối (Zero Progress Loss):** Cơ chế bảo vệ Level-Drift Guard ngăn chặn lệch cấp độ từ vựng khi nâng cấp, bảo toàn 100% dữ liệu SRS, streak và tiến độ bài học đã hoàn thành.
            - **Offline-First & CDN Tối Ưu:** HSK 1–2 nạp sẵn; HSK 3–6 hỗ trợ tải về theo nhu cầu qua CDN bảo mật với mã băm Canonical SHA-256 đối soát chặt chẽ.
            - **Split-ABI APKs (< 45MB):** Tối ưu hóa kích thước cài đặt, chia riêng theo kiến trúc vi xử lý (arm64-v8a và armeabi-v7a).

            ### 📦 Danh Sách Tệp APK Cài Đặt (Release APKs)
            - **`hi-chinese-v1.0.14-arm64-v8a.apk`** (44.1 MB): Dành cho hầu hết thiết bị Android 64-bit hiện đại (khuyên dùng).
            - **`hi-chinese-v1.0.14-armeabi-v7a.apk`** (42.0 MB): Dành cho thiết bị Android 32-bit đời cũ hoặc máy cấu hình phổ thông.
            - **`app-release.apk`** (44.1 MB): Bản dựng Release tiêu chuẩn (arm64-v8a).
          files: |
            release-apk/hi-chinese-v1.0.14-arm64-v8a.apk
            release-apk/hi-chinese-v1.0.14-armeabi-v7a.apk
            release-apk/app-release.apk
